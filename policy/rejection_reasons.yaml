rejection_reasons:
  off_domain: Role does not match an allowed technical category.
  pay_unstated: Compensation absent or not explicit.
  commission_only: Commission-only compensation.
  equity_only: Equity-only compensation.
  agency_posting: Posting identifies a third-party recruitment or staffing agency rather than the hiring employer.
  scam_signal: Credible scam indicators.
  apply_domain_unknown: Application destination cannot be verified.
  region_ineligible: Applicant location explicitly excluded.
  duplicate: Duplicate opportunity.
  expired: Job closed or expired.
  not_remote: Hybrid, onsite or unconfirmed remote status.
  employment_type_not_allowed: Employment type outside policy.
  employer_unverifiable: Employer identity or employer domain cannot be verified.
  paid_to_apply: Candidate asked to pay to apply.
  pay_to_start: Candidate is asked to pay a registration, training, onboarding or equipment fee to begin.
  dm_only_hiring: Hiring process directs applicants to informal direct-message contact.
  whatsapp_hiring: Hiring process directs applicants to WhatsApp or an equivalent messaging link.
  crypto_trading_scheme: Crypto or investment scheme.
  network_marketing: Multi-level/network marketing.
  vague_data_entry: Vague remote data-entry offer.
  generic_virtual_assistant: Generic VA role outside target scope.
  source_url_invalid: Source URL is not a valid HTTPS URL with a hostname.
  source_blocked: Source domain is explicitly blocked by source policy.
  source_not_approved: Source is not enabled and approved for this source type.

review_flags:
  source_requires_review: Source domain is explicitly configured for human review.
  geographic_eligibility_unclear: Job posting does not state eligible countries or regions.
  applicant_location_match_not_assessed: Eligible regions are listed but have not been compared with an explicitly supplied applicant location profile.
  employer_identity_not_independently_verified: Employer domain syntax is valid but its relationship to the named employer has not been independently verified.
  compensation_conversion_unclear: Compensation cannot be reliably normalized or compared without an explicit conversion assumption.
  employer_identity_conflict: Available evidence contains conflicting claims about the named employer or its domain.
  application_domain_unverified: The application destination has not been verified as controlled by the employer or an approved ATS.
  security_or_screening_declaration: The application requests a security, background-screening, or other declaration requiring human assessment.
  any_personal_data_submission: Personal data would be transmitted and requires explicit human review before submission.
