policy_id: remote_software_engineering_job_qualifier
version: 1
status: draft
target_categories: [backend_engineering, frontend_engineering, full_stack_engineering, software_engineering, platform_engineering, cloud_engineering, devops, site_reliability_engineering, data_engineering, machine_learning_engineering, qa_automation]
employment_types: [full_time, contract]
workplace: remote_only
compensation:
  accepted_types: [salary, hourly]
  require_amount: true
  require_currency: true
  require_period: true
  reject_unspecified: true
geography:
  require_country_or_region_statement: true
  unknown_eligibility: REVIEW
  applicant_location_match_without_profile: REVIEW
employer:
  require_verifiable_identity: true
  require_official_domain_or_approved_ats: true
  identity_relationship_unverified: REVIEW
role:
  require_target_category_match: true
  unrelated_roles: REJECT
sources:
  employer_ats_only_by_default: true
  approved_source_file: sources/approved_sources.yaml
  watchlist_file: sources/watchlist.yaml
hard_rejections:
  - off_domain
  - pay_unstated
  - commission_only
  - equity_only
  - agency_posting
  - not_remote
  - employment_type_not_allowed
  - employer_unverifiable
  - region_ineligible
  - paid_to_apply
  - pay_to_start
  - dm_only_hiring
  - whatsapp_hiring
  - crypto_trading_scheme
  - network_marketing
  - vague_data_entry
  - generic_virtual_assistant
  - source_url_invalid
  - source_blocked
  - source_not_approved
human_review_required:
  - source_requires_review
  - geographic_eligibility_unclear
  - applicant_location_match_not_assessed
  - employer_identity_not_independently_verified
  - compensation_conversion_unclear
  - employer_identity_conflict
  - application_domain_unverified
  - security_or_screening_declaration
  - any_personal_data_submission
stop_conditions:
  max_runtime_minutes: 45
  max_sources_per_run: 8
  max_discovery_attempts: 120
  max_unique_candidates: 250
  max_validation_attempts: 250
  max_application_attempts: 0
  max_browser_sessions: 2
  max_retries_per_operation: 2
  max_llm_calls: 100
  max_llm_cost_usd: 2.0
